name: Release

# Publishes zerialize and zerialize-macros to crates.io via Trusted Publishing (OIDC) on a `v*` tag
# push, after approval in the `crates-io` environment. No crates.io token is stored anywhere: the
# job exchanges its OIDC token for one that expires after 30 minutes and is revoked when the job
# ends. Both crates need a trusted publisher configured on crates.io.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Kept minimal and pinned to commit SHAs: this is the only job that can request an OIDC token,
  # and the `crates-io` environment requires a maintainer's approval before it runs.
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/zerialize
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check tag matches the workspace crates' versions
        run: |
          mismatched=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg tag "$GITHUB_REF_NAME" \
              '.packages[] | select("v" + .version != $tag) | "\(.name) \(.version)"')
          if [ -n "$mismatched" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the version of:" >&2
            echo "$mismatched" >&2
            exit 1
          fi

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      # Publishes zerialize-macros before zerialize, which depends on it
      - name: Publish
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
