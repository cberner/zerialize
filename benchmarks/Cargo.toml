[package]
name = "zerialize-benchmarks"
description = "Size and speed comparison of zerialize against rkyv and flatbuffers"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
zerialize = { path = ".." }
flatbuffers = "2.0"
rkyv = "0.8"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bin]]
name = "sizes"
path = "src/sizes.rs"

[[bench]]
name = "speed"
harness = false

[profile.release]
lto = true
codegen-units = 1
