[workspace]
members = ["macros"]
# The benchmarks pull in rkyv and flatbuffers to compare against, which the
# library itself has no business depending on. They are built by `just bench`.
exclude = ["benchmarks"]

# Both crates are released as one version. `cargo package` rewrites the path
# dependency below into a registry one, so a macros crate left behind at an
# already published version is silently resolved from crates.io rather than from
# this workspace. The version lives here, and the requirement naming it sits
# beside it, so a release bumps the two together.
[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cberner/zerialize"
authors = ["Christopher Berner <me@cberner.com>"]

[workspace.dependencies]
zerialize-macros = { version = "0.0.0", path = "macros" }

[package]
name = "zerialize"
description = "Zero-copy serialization"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
authors.workspace = true

[dependencies]
zerialize-macros.workspace = true
